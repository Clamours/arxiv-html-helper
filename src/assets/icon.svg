<!-- 扩展图标：arXiv 红的笔记本，封面一个衬线体 "a"，底下一道荧光笔划线。字体用系统 Georgia，导出 PNG 见 scripts/render-icons.sh。viewBox 裁到图案外缘只留约 1px 边，让工具栏里的图标和其他扩展一样大 -->
